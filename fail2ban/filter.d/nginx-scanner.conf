# Requests for files this app never serves: dotfiles, cloud credentials,
# PHP and WordPress paths. Nobody legitimate asks for these. The path part
# only, so a login redirect carrying "/.env" in its query string isn't one.
# Twin of SCANNER_PATH in lib/probe-traffic.ts (lib/fail2ban-parity.test.ts).
# fail2ban cuts the timestamp out of the line before matching, hence "\[\]".
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^" ?]*(?:/\.(?:env|git|aws|ssh|DS_Store)|\.php\b|/wp-(?:admin|login|content|includes)|/(?:phpmyadmin|cgi-bin|actuator|server-status)\b)[^" ]* HTTP/[\d.]+" \d{3} 
ignoreregex =
