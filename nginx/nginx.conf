events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  # Don't advertise the nginx version in headers and error pages.
  server_tokens off;

  # Timeouts — prevent slow-loris and hung connections
  keepalive_timeout      65;
  client_body_timeout    12;
  client_header_timeout  12;
  send_timeout           10;

  # Request size limits
  client_max_body_size       10m;
  client_body_buffer_size    128k;
  client_header_buffer_size  1k;
  large_client_header_buffers 4 8k;

  # Proxy timeouts
  proxy_connect_timeout  10;
  proxy_read_timeout     60;
  proxy_send_timeout     60;

  # Connection limit per IP
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # Gzip
  gzip              on;
  gzip_types        text/plain text/css application/javascript application/json application/xml;
  gzip_min_length   1000;

  # Bot blocking
  map $http_user_agent $bad_bot {
    default           0;
    ~*sqlmap          1;
    ~*nikto           1;
    ~*nmap            1;
    ~*masscan         1;
    ~*zgrab           1;
    ~*python-requests 1;
    ~*go-http-client  1;
    ~*curl/           1;
  }

  # Access log for monitor parsing
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Restore real visitor IP from Cloudflare's header
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Rate limits
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  # Default is 503, which the monitor's 5xx check would read as an outage.
  limit_req_status 429;

  server {
    listen 80;
    server_name example.com www.example.com admin.example.com;  # your domain
    return 301 https://$host$request_uri;
  }

  # admin.<your domain> is the admin dashboard: the same app, which serves
  # it on that host only (lib/admin-host.ts, proxy.ts). The certificate in
  # ssl/ must cover your domain and its admin. subdomain. As the default server
  # it also takes
  # merchants' custom domains (Cloudflare for SaaS forwards them here), where
  # the app answers only their payment pages (lib/custom-host.ts).
  server {
    listen 443 ssl default_server;
    server_name example.com www.example.com admin.example.com;  # your domain

    ssl_certificate     /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (repeated in any location with its own add_header)
    include /etc/nginx/snippets/security-headers.conf;

    # Per-IP connection cap
    limit_conn conn_per_ip 50;

    # Block bad bots
    if ($bad_bot) { return 403; }

    # Custom JSON error pages
    error_page 502 503 504 @error_json;
    location @error_json {
      default_type application/json;
      return 503 '{"error":"Service temporarily unavailable"}';
    }

    location / {
      include /etc/nginx/snippets/proxy-app.conf;
    }

    # CSRF token fetch — GET only, no rate limit. This is not the attack surface.
    location = /api/auth/csrf {
      include /etc/nginx/snippets/proxy-app.conf;
    }

    # Sign-in, sign-out, callbacks — rate limit applies here
    location /api/auth {
      limit_req zone=auth burst=10 nodelay;
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      include /etc/nginx/snippets/proxy-app.conf;
    }

    location /api/public {
      limit_req zone=api burst=20 nodelay;
      include /etc/nginx/snippets/proxy-app.conf;
    }
  }
}