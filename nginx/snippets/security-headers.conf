# Security headers, included at server level AND in every location that sets
# its own add_header. nginx only inherits add_header directives into a location
# that declares none of its own, so a location adding e.g. Cache-Control would
# otherwise silently drop all of these.
#
# No Content-Security-Policy yet: the Next app relies on inline scripts/styles
# and Cloudflare Turnstile, so a strict policy needs nonces wired through the
# app first — a wrong one breaks sign-in and checkout.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options        "SAMEORIGIN"     always;
add_header X-Content-Type-Options "nosniff"        always;
add_header X-XSS-Protection       "1; mode=block"  always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
