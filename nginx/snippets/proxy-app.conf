# Upstream request headers for every location proxied to the app.
#
# X-Forwarded-For is set to the client address nginx resolved (Cloudflare's
# CF-Connecting-IP via real_ip) rather than $proxy_add_x_forwarded_for, which
# APPENDS to whatever XFF the client sent — letting any caller choose the first
# entry and so its apparent IP for the app's rate limiting.
proxy_pass http://app:3000;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
